<h2>Dodaj studenta</h2>
<form (ngSubmit)="dodajStudenta()">
  <label for="imie">Imię:</label>
  <input
    type="text"
    id="imie"
    name="imie"
    [(ngModel)]="imie"
    (ngModelChange)="imie.set($event)"
  />

  <label for="nazwisko">Nazwisko:</label>
  <input
    type="text"
    id="nazwisko"
    name="nazwisko"
    [(ngModel)]="nazwisko"
    (ngModelChange)="nazwisko.set($event)"
  />

  <label for="wiek">Wiek:</label>
  <input
    type="number"
    id="wiek"
    name="wiek"
    [(ngModel)]="wiek"
    (ngModelChange)="wiek.set($event)"
  />

  <button type="button" (click)="dodajStudenta()">Dodaj studenta</button>
</form>
