<main>
  <h1>{{ tytul_listy }}</h1>

  <app-add-student (studentAdded)="dodajStudenta($event)"></app-add-student>

  <section>
    @for (student of studenci; track $index) {
      <article>
        <h2
          (click)="pokazSzczegoly(student)"
          tabindex="0"
          role="button"
        >
          {{ student.imie }} {{ student.nazwisko }}
        </h2>

        @if (rozwinietyStudent === student) {
          <p>Wiek: {{ student.wiek }}</p>

          <p>Oceny:</p>

          @for (ocena of student.oceny; track $index) {
            <span [class.ocena-negatywna]="ocena === 2.0">
              {{ ocena }}
            </span>
          }
        }
      </article>
    }
  </section>
</main>
